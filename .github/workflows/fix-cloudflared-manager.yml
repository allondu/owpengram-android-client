name: Fix cloudflared manager

on:
  push:
    branches:
      - freebuff/cloudflared-inprocess
    paths:
      - .github/workflows/fix-cloudflared-manager.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: freebuff/cloudflared-inprocess

      - name: Fix intent extra and remove this workflow
        run: |
          set -euo pipefail
          file=TMessagesProj/src/main/java/org/telegram/utils/proxy/CloudflaredTunnelManager.java
          sed -i 's/\.putExta(/.putExtra(/g' "$file"
          grep -q 'putExtra(CloudflaredTunnelService.EXTRA_PORT' "$file"
          git config user.name 'cloudflared-fix'
          git config user.email 'cloudflared-fix@users.noreply.github.com'
          git add "$file"
          git rm .github/workflows/fix-cloudflared-manager.yml
          git commit -m 'Fix CloudflaredTunnelManager intent extra typo'
          git push origin HEAD:freebuff/cloudflared-inprocess
