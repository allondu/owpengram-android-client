name: Fix native carrier JNI signature
on:
  push:
    branches: [ freebuff/cloudflared-native-carrier ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    if: "github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'align applyServerConfig JNI signature')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: freebuff/cloudflared-native-carrier
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Unpack fix
        run: |
          curl -fsSL --retry 3 -m 180 -o /tmp/tgnet-fix.tar.gz https://d.uguu.se/hwxVSCzhUZbw.tar.gz
          echo "07a3641fb08340dff23c9bf778fa69edbc8027ff2ca3d8a17649e02e4d200717  /tmp/tgnet-fix.tar.gz" | sha256sum -c -
          tar xzf /tmp/tgnet-fix.tar.gz
          rm -f .github/workflows/fix-native-carrier.yml
      - name: Commit and push
        run: |
          git config user.name "Meralchen"
          git config user.email "67538314+Meralchen@users.noreply.github.com"
          git add -A
          git commit -m "fix: align applyServerConfig JNI signature"
          git push origin HEAD:freebuff/cloudflared-native-carrier
