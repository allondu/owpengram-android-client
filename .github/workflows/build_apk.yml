name: Build APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  commit:
    name: Commit version naming
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          lfs: false
      - name: Apply and commit the naming changes
        run: |
          base64 --decode naming.patch.gz.b64 | gzip --decompress > /tmp/naming.patch
          git apply --whitespace=nowarn /tmp/naming.patch
          git rm -q naming.patch.gz.b64 naming-build_apk.yml.gz.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Add lettered release versions (O20.a ... O20.z -> O21.a)"
          git push origin HEAD:release/version-letters
