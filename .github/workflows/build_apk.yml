name: Build APK

on:
  push:
    branches: [main]
    tags: ['O*']
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'debug (fast, debuggable), stable (minified, per-ABI APKs) or both'
        type: choice
        options: [both, debug, stable]
        default: both
      owpengram_build:
        description: 'Release number (the N in tag ON); leave empty for the next free number, 0 for a local/dev build with no release'
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Pull request runs replace each other; a run that publishes a release is
  # never cancelled half-way, because that APK is what the in-app updater offers.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NDK_VERSION: 27.2.12479018
  CMAKE_VERSION: 3.22.1
  BUILD_TOOLS_VERSION: 36.0.0
  PLATFORM_VERSION: android-36
  # Where the hosted runner keeps the Android SDK; the toolchain cache needs it.
  ANDROID_SDK_PATH: /usr/local/lib/android/sdk

jobs:
  # The release number is baked into the APK (BuildVars.OWPENGRAM_BUILD) and the
  # updater compares it with the newest O<N> release, so it has to be decided
  # before anything is built. Every push to main publishes the next free number.
  version:
    name: Release number
    runs-on: ubuntu-latest
    outputs:
      number: ${{ steps.resolve.outputs.number }}
      release: ${{ steps.resolve.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1
          lfs: false

      - name: Resolve release number
        id: resolve
        env:
          INPUT_BUILD: ${{ github.event.inputs.owpengram_build }}
          INPUT_BUILD_TYPE: ${{ github.event.inputs.build_type }}
        run: |
          number=0
          release=false
          if [[ "$GITHUB_REF" == refs/tags/O* ]]; then
            number="${GITHUB_REF#refs/tags/O}"
            release=true
          elif [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            # nothing is published from a pull request
            number=0
          elif [[ -n "$INPUT_BUILD" ]]; then
            number="$INPUT_BUILD"
            if [[ "$number" != 0 ]]; then release=true; fi
          else
            # one past the highest O<N> tag that already exists
            latest="$(git ls-remote --tags --refs origin 'refs/tags/O*' \
              | sed -n 's#.*refs/tags/[Oo]\([0-9][0-9]*\)$#\1#p' \
              | sort -n | tail -1)"
            number="$(( ${latest:-0} + 1 ))"
            release=true
          fi
          if ! [[ "$number" =~ ^[0-9]+$ ]]; then
            echo "::error::OWPENGRAM_BUILD must be a whole number, got '$number'"
            exit 1
          fi
          # a debug-only manual run builds an APK that is never published
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$INPUT_BUILD_TYPE" == debug ]]; then
            release=false
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "Release number O$number, publish: $release"

  apk:
    name: Standalone APK (${{ matrix.variant }})
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON((github.event.inputs.build_type == 'debug' && '["debug"]') || (github.event.inputs.build_type == 'stable' && '["stable"]') || '["debug","stable"]') }}
    env:
      # wallet-engine keeps iOS snapshot PNGs in LFS; the Android build needs none of them.
      GIT_LFS_SKIP_SMUDGE: '1'
      # ccache: the NDK is reinstalled every run, so compare compilers by content, not mtime.
      CCACHE_COMPILERCHECK: content
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: 'true'
      CCACHE_SLOPPINESS: time_macros
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          docker image prune --all --force || true
          df -h /

      - uses: actions/checkout@v4
        with:
          # The Go server is a separate submodule and is not needed to build the Android client.
          # Its local gitlink may point at an unpublished server commit, so initialize only the
          # Android source/native dependencies required by Gradle and CMake.
          submodules: false
          fetch-depth: 1
          lfs: false

      - name: Checkout Android submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --force --depth=1 --recursive -- \
            TMessagesProj/jni/td \
            TMessagesProj/jni/tgcalls \
            TMessagesProj/jni/tlottie \
            TMessagesProj/jni/wallet-engine \
            TMessagesProj/jni/third_party/absl \
            TMessagesProj/jni/third_party/boost-regex \
            TMessagesProj/jni/third_party/boringssl \
            TMessagesProj/jni/third_party/dav1d \
            TMessagesProj/jni/third_party/ffmpeg \
            TMessagesProj/jni/third_party/libprisma \
            TMessagesProj/jni/third_party/libvpx \
            TMessagesProj/jni/third_party/libyuv \
            TMessagesProj/jni/third_party/openh264 \
            TMessagesProj/jni/third_party/wamr \
            TMessagesProj/jni/third_party/xiph/ogg \
            TMessagesProj/jni/third_party/xiph/opus \
            TMessagesProj/jni/third_party/xiph/opusfile \
            TMessagesProj/lib/jlatexmath \
            TMessagesProj_Modules/media

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The image ships no NDK (the disk-space step above removes it) and
      # downloading NDK plus CMake costs several minutes on every build. Gradle's
      # and ccache's caches only cover build outputs, not installed SDK packages,
      # so keep the toolchain here; setup-android then finds it already installed.
      - name: Cache Android NDK and CMake
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_SDK_PATH }}/ndk/${{ env.NDK_VERSION }}
            ${{ env.ANDROID_SDK_PATH }}/cmake/${{ env.CMAKE_VERSION }}
          key: android-toolchain-${{ runner.os }}-ndk-${{ env.NDK_VERSION }}-cmake-${{ env.CMAKE_VERSION }}

      - uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;${{ env.PLATFORM_VERSION }}
            build-tools;${{ env.BUILD_TOOLS_VERSION }}
            ndk;${{ env.NDK_VERSION }}
            cmake;${{ env.CMAKE_VERSION }}

      # Gradle caches are written on every branch and PR (the action's default
      # is read-only outside main), so follow-up builds of a PR start warm too.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # Native code (tdlib, ffmpeg, boringssl, tgcalls, ...) dominates build
      # time and Gradle's build cache does not cover CMake, so cache the
      # compiled objects with ccache, separately per variant.
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ndk-${{ env.NDK_VERSION }}-${{ matrix.variant }}
          restore-keys: ndk-${{ env.NDK_VERSION }}-${{ matrix.variant }}
          max-size: 3G

      - name: Reset ccache statistics
        run: ccache --zero-stats

      # Both build types of :TMessagesProj_AppStandalone sign with
      # TMessagesProj/config/release.keystore, which is gitignored. With the
      # KEYSTORE_BASE64 secret set (plus RELEASE_STORE_PASSWORD,
      # RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD) the APK carries the real
      # signature and installs over an existing OwpenGram. Without it -- forks,
      # pull requests -- a throwaway key is generated so the APK still builds,
      # but it cannot update an install signed with the real key.
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          keystore=TMessagesProj/config/release.keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
            {
              echo "ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD=$STORE_PASSWORD"
              echo "ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS=$KEY_ALIAS"
              echo "ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Signing with the release keystore from secrets."
          else
            echo "::warning::KEYSTORE_BASE64 is not set -- signing with a throwaway key."
            keytool -genkeypair -noprompt -keystore "$keystore" -storetype JKS \
              -alias androidkey -storepass android -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=OwpenGram CI, O=OwpenGram"
          fi

      - name: Build
        run: |
          if [ "${{ matrix.variant }}" = stable ]; then task=Standalone; dir=standalone; else task=Debug; dir=debug; fi
          echo "APK_DIR=TMessagesProj_AppStandalone/build/outputs/apk/afat/$dir" >> "$GITHUB_ENV"
          ./gradlew --no-daemon --stacktrace --build-cache \
            -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g" \
            -POWPENGRAM_BUILD=${{ needs.version.outputs.number }} \
            -POWPENGRAM_PUBLIC_HOST="${{ vars.OWPENGRAM_PUBLIC_HOST }}" \
            -POWPENGRAM_APP_LINKS_VERIFIED="${{ vars.OWPENGRAM_APP_LINKS_VERIFIED }}" \
            -PNATIVE_COMPILER_LAUNCHER=ccache \
            :TMessagesProj_AppStandalone:assembleAfat$task
          ccache --show-stats

      # ABI splits keep each APK from shipping native libraries for other
      # architectures; the universal APK is the fallback for anything else.
      - name: Collect APKs
        id: apk
        run: |
          base="owpengram-${{ matrix.variant }}-O${{ needs.version.outputs.number }}-${GITHUB_SHA::7}"
          mkdir -p dist
          mapfile -t apks < <(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -print | sort)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "::error::No APK outputs found in $APK_DIR"
            exit 1
          fi
          for apk in "${apks[@]}"; do
            output="$(basename "$apk" .apk)"
            cp "$apk" "dist/$base-$output.apk"
          done
          ls -l dist
          echo "name=$base" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14
          # APKs are zip files already.
          compression-level: 0

  # Publishes the stable APKs as the O<number> release the in-app updater looks
  # for. The tag is created here, so nobody has to remember to push one.
  release:
    name: Publish O${{ needs.version.outputs.number }}
    needs: [version, apk]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      # An APK signed with the throwaway key cannot install over an existing
      # OwpenGram, so publishing it would give the updater a download that always
      # fails. The build job still falls back to the throwaway key for forks and
      # pull requests; a release needs the real keystore.
      - name: Check signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not set: the APK is signed with a throwaway key and cannot update an installed OwpenGram. Add the release keystore secret before publishing."
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          pattern: owpengram-stable-*
          path: dist
          merge-multiple: true

      # One APK per CPU architecture plus the universal APK, named so the
      # updater can hand each device the build it can actually run.
      - name: Name APKs
        env:
          TAG: O${{ needs.version.outputs.number }}
        run: |
          cd dist
          shopt -s nullglob
          apks=(*.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "::error::No stable APK was downloaded"
            exit 1
          fi
          for apk in "${apks[@]}"; do
            abi=universal
            for candidate in arm64-v8a armeabi-v7a x86_64 x86; do
              if [[ "$apk" == *"$candidate"* ]]; then abi="$candidate"; break; fi
            done
            mv "$apk" "owpengram-$TAG-$abi.apk"
          done
          ls -l

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: O${{ needs.version.outputs.number }}
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # a re-run for a number that is already published: replace the APKs
            gh release upload "$TAG" -R "$GITHUB_REPOSITORY" dist/*.apk --clobber
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" dist/*.apk \
              --target "$GITHUB_SHA" \
              --title "OwpenGram $TAG" \
              --generate-notes \
              --latest
          fi
