name: Build APK

on:
  push:
    branches: [main]
    tags: ['O*']
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'debug (fast, debuggable), stable (minified, per-ABI APKs) or both'
        type: choice
        options: [both, debug, stable]
        default: both
      owpengram_build:
        description: 'Release number (the N in tag ON); 0 = local/dev build without self-update'
        default: '0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NDK_VERSION: 27.2.12479018
  CMAKE_VERSION: 3.22.1
  BUILD_TOOLS_VERSION: 36.0.0
  PLATFORM_VERSION: android-36

jobs:
  apk:
    name: Standalone APK (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON((github.event.inputs.build_type == 'debug' && '["debug"]') || (github.event.inputs.build_type == 'stable' && '["stable"]') || '["debug","stable"]') }}
    env:
      # wallet-engine keeps iOS snapshot PNGs in LFS; the Android build needs none of them.
      GIT_LFS_SKIP_SMUDGE: '1'
      # ccache: the NDK is reinstalled every run, so compare compilers by content, not mtime.
      CCACHE_COMPILERCHECK: content
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: 'true'
      CCACHE_SLOPPINESS: time_macros
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          docker image prune --all --force || true
          df -h /

      - uses: actions/checkout@v4
        with:
          # The Go server is a separate submodule and is not needed to build the Android client.
          # Its local gitlink may point at an unpublished server commit, so initialize only the
          # Android source/native dependencies required by Gradle and CMake.
          submodules: false
          fetch-depth: 1
          lfs: false

      - name: Checkout Android submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --force --depth=1 --recursive -- \
            TMessagesProj/jni/td \
            TMessagesProj/jni/tgcalls \
            TMessagesProj/jni/tlottie \
            TMessagesProj/jni/wallet-engine \
            TMessagesProj/jni/third_party/absl \
            TMessagesProj/jni/third_party/boost-regex \
            TMessagesProj/jni/third_party/boringssl \
            TMessagesProj/jni/third_party/dav1d \
            TMessagesProj/jni/third_party/ffmpeg \
            TMessagesProj/jni/third_party/libprisma \
            TMessagesProj/jni/third_party/libvpx \
            TMessagesProj/jni/third_party/libyuv \
            TMessagesProj/jni/third_party/openh264 \
            TMessagesProj/jni/third_party/wamr \
            TMessagesProj/jni/third_party/xiph/ogg \
            TMessagesProj/jni/third_party/xiph/opus \
            TMessagesProj/jni/third_party/xiph/opusfile \
            TMessagesProj/lib/jlatexmath \
            TMessagesProj_Modules/media

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;${{ env.PLATFORM_VERSION }}
            build-tools;${{ env.BUILD_TOOLS_VERSION }}
            ndk;${{ env.NDK_VERSION }}
            cmake;${{ env.CMAKE_VERSION }}

      # Gradle caches are written on every branch and PR (the action's default
      # is read-only outside main), so follow-up builds of a PR start warm too.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # Native code (tdlib, ffmpeg, boringssl, tgcalls, ...) dominates build
      # time and Gradle's build cache does not cover CMake, so cache the
      # compiled objects with ccache, separately per variant.
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ndk-${{ env.NDK_VERSION }}-${{ matrix.variant }}
          max-size: 3G

      - name: Resolve release number
        id: version
        env:
          INPUT_BUILD: ${{ github.event.inputs.owpengram_build }}
        run: |
          number="${INPUT_BUILD:-0}"
          if [[ "$GITHUB_REF" == refs/tags/O* ]]; then
            number="${GITHUB_REF#refs/tags/O}"
          fi
          if ! [[ "$number" =~ ^[0-9]+$ ]]; then
            echo "::error::OWPENGRAM_BUILD must be a whole number, got '$number'"
            exit 1
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      # Both build types of :TMessagesProj_AppStandalone sign with
      # TMessagesProj/config/release.keystore, which is gitignored. With the
      # RELEASE_KEYSTORE_BASE64 secret set (plus RELEASE_STORE_PASSWORD,
      # RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD) the APK carries the real
      # signature and installs over an existing OwpenGram. Without it -- forks,
      # pull requests -- a throwaway key is generated so the APK still builds,
      # but it cannot update an install signed with the real key.
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          keystore=TMessagesProj/config/release.keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
            {
              echo "ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD=$STORE_PASSWORD"
              echo "ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS=$KEY_ALIAS"
              echo "ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Signing with the release keystore from secrets."
          else
            echo "::warning::RELEASE_KEYSTORE_BASE64 is not set -- signing with a throwaway key."
            keytool -genkeypair -noprompt -keystore "$keystore" -storetype JKS \
              -alias androidkey -storepass android -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=OwpenGram CI, O=OwpenGram"
          fi

      - name: Build
        run: |
          if [ "${{ matrix.variant }}" = stable ]; then task=Standalone; dir=standalone; else task=Debug; dir=debug; fi
          echo "APK_DIR=TMessagesProj_AppStandalone/build/outputs/apk/afat/$dir" >> "$GITHUB_ENV"
          ./gradlew --no-daemon --stacktrace --build-cache \
            -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g" \
            -POWPENGRAM_BUILD=${{ steps.version.outputs.number }} \
            -POWPENGRAM_PUBLIC_HOST="${{ vars.OWPENGRAM_PUBLIC_HOST }}" \
            -POWPENGRAM_APP_LINKS_VERIFIED="${{ vars.OWPENGRAM_APP_LINKS_VERIFIED }}" \
            -PNATIVE_COMPILER_LAUNCHER=ccache \
            :TMessagesProj_AppStandalone:assembleAfat$task
          ccache --show-stats

      # debug: the universal APK. stable: the universal APK plus one APK per ABI
      # (arm64-v8a fits almost every current phone).
      - name: Collect APKs
        id: apk
        run: |
          base="owpengram-${{ matrix.variant }}-O${{ steps.version.outputs.number }}-${GITHUB_SHA::7}"
          mkdir -p dist
          cp "$APK_DIR/app.apk" "dist/$base-universal.apk"
          if [ "${{ matrix.variant }}" = stable ]; then
            for apk in "$APK_DIR"/app-*.apk; do
              abi="$(basename "$apk" .apk)"; abi="${abi#app-}"
              cp "$apk" "dist/$base-$abi.apk"
            done
          fi
          ls -l dist
          echo "name=$base" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14
          # APKs are zip files already.
          compression-level: 0