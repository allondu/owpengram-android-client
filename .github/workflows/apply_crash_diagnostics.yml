name: Apply OwpenGram crash diagnostics patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch and push
        run: |
          set -euo pipefail
          git apply owpengram-crash-diagnostics.patch
          git config user.name Meralchen
          git config user.email 67538314+Meralchen@users.noreply.github.com
          git add \
            TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java \
            TMessagesProj/src/main/java/org/telegram/messenger/FileLog.java \
            TMessagesProj/src/main/java/org/telegram/owpengram/OwpengramLogs.java \
            TMessagesProj/src/main/java/org/telegram/ui/SettingsActivity.java \
            TMessagesProj/src/main/java/org/telegram/utils/proxy/CloudflaredTunnelManager.java \
            TMessagesProj/src/main/java/org/telegram/utils/proxy/CloudflaredTunnelService.java \
            TMessagesProj/src/main/res/values/owpengram_logs.xml
          git commit -m "fix: expose the stored crash report and harden Cloudflared" \
            -m "Settings -> Logging can now show and copy the last crash trace, and the crash file is also written to internal storage because Android/data is not reachable on newer releases. Guard the Cloudflared activity and connectivity callbacks so a tunnel error cannot kill the app, wait for log writers before deleting logs, and stop cloudflared output from queueing unbounded log writes."
          git rm owpengram-crash-diagnostics.patch .github/workflows/apply_crash_diagnostics.yml
          git commit -m "[skip ci] chore: remove the one-off crash diagnostics patch"
          git push origin HEAD:main
