name: Apply pending logo patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    name: Apply patch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply patch
        run: |
          set -euo pipefail
          base64 -d .github/pending-logo.patch.gz.b64 | gunzip > /tmp/pending-logo.patch
          git apply --binary --whitespace=nowarn /tmp/pending-logo.patch
          git rm -f TMessagesProj/src/main/res/drawable-nodpi/server_owpengram.png
          git rm -f TMessagesProj/src/main/res/drawable/splash_owpengram.xml
          git rm -f .github/workflows/apply-logo-patch.yml .github/pending-logo.patch.gz.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: update flag logo, settings layout and help links"
          git push origin HEAD:${{ github.ref_name }}
