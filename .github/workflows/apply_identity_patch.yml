name: Apply encRgraM identity

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Pillow
        run: python3 -m pip install --quiet pillow

      - name: Download source artwork
        run: |
          curl -fsSL -o /tmp/logo1.jpg 'https://files.catbox.moe/00r0ae.jpg'
          curl -fsSL -o /tmp/logo3.jpg 'https://files.catbox.moe/bnc12t.jpg'
          curl -fsSL -o /tmp/logo4.jpg 'https://files.catbox.moe/ud4kwm.jpg'

      - name: Apply source changes and generate icons
        run: |
          gzip -dc owpengram-identity.patch.gz.b64 > /tmp/identity.patch
          git apply --whitespace=nowarn /tmp/identity.patch
          python3 owpengram-generate-icons.py /tmp/logo1.jpg /tmp/logo3.jpg /tmp/logo4.jpg
          while IFS= read -r path; do
            [ -n "$path" ] && rm -f "$path"
          done < owpengram-deleted-icons.txt
          rm -f owpengram-identity.patch.gz.b64 owpengram-generate-icons.py owpengram-deleted-icons.txt
          rm -f .github/workflows/apply_identity_patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add encRgraM identity and Secret Chat Only demo'
          git push origin HEAD:${{ github.ref_name }}
