name: Apply O20.b media bridge

on:
  push:
    branches: [release/o20b]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize the release commit
        run: |
          set -euo pipefail
          mkdir -p TMessagesProj/src/main/java/org/telegram/utils/proxy
          base64 -d .github/o20b/class.b64 > TMessagesProj/src/main/java/org/telegram/utils/proxy/CloudflaredMediaBridge.java
          base64 -d .github/o20b/voip.patch.b64 > /tmp/o20b.patch
          git apply --check /tmp/o20b.patch
          git apply /tmp/o20b.patch
          rm -f /tmp/o20b.patch
          rm -rf .github/o20b
          rm -f .github/workflows/apply-o20b.yml
          git config user.name "OwpenGram Release"
          git config user.email "release@owpengram.org"
          git add -A
          git commit -m "Release O20.b: carry call media over the Cloudflared tunnel"
          git push origin HEAD:release/o20b
