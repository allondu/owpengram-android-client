name: Fix O20.b media bridge

on:
  push:
    branches: [release/o20b]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix the three identifiers
        run: |
          set -euo pipefail
          f=TMessagesProj/src/main/java/org/telegram/utils/proxy/CloudflaredMediaBridge.java
          sed -i 's/session\.offer(bufer, packet\.getLength())/session.offer(buffer, packet.getLength())/' "$f"
          sed -i 's/IDlE_MS/IDLE_MS/g' "$f"
          sed -i 's/USE_STD_ASNII_RULES/USE_STD3_ASCII_RULES/g' "$f"
          grep -q 'session.offer(buffer, packet.getLength())' "$f"
          grep -q 'IDLE_MS' "$f"
          grep -q 'USE_STD3_ASCII_RULES' "$f"
          ! grep -q 'bufer\|IDlE_MS\|USE_STD_ASNII_RULES' "$f"
          rm -f .github/workflows/fix-o20b.yml
          git config user.name "OwpenGram Release"
          git config user.email "release@owpengram.org"
          git add -A
          git commit -m "Fix the O20.b media bridge identifiers"
          git push origin HEAD:release/o20b
